<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Smartphone frame -->
  <rect x="140" y="80" width="232" height="352" rx="36" fill="#f8fafc" filter="url(#shadow)"/>
  <!-- Phone screen -->
  <rect x="156" y="112" width="200" height="288" rx="20" fill="#0f172a"/>
  
  <!-- Speaker / camera notch pill -->
  <rect x="226" y="94" width="60" height="8" rx="4" fill="#cbd5e1"/>
  
  <!-- Points / Star Coin -->
  <circle cx="256" cy="226" r="64" fill="url(#coinGrad)" stroke="#fef3c7" stroke-width="6"/>
  <!-- Star shape in center -->
  <path d="M 256 182 L 268 214 L 302 216 L 275 236 L 285 270 L 256 250 L 227 270 L 237 236 L 210 216 L 244 214 Z" fill="#ffffff"/>
  
  <!-- Phone screen time gauge / progress bar -->
  <rect x="180" y="320" width="152" height="14" rx="7" fill="#334155"/>
  <rect x="180" y="320" width="108" height="14" rx="7" fill="#10b981"/>
  
  <!-- Small home indicator bar -->
  <rect x="220" y="412" width="72" height="6" rx="3" fill="#94a3b8"/>
</svg>
